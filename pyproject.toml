[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "timetable-amplify"
version = "0.2.0"
description = "Maintainable timetable optimization using Fixstars Amplify"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
timetable-amplify = "timetable_amplify.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
